<!-- Top Navbar with Status -->
<nav class="navbar-top" *ngIf="isLoggedIn">
  <div class="container-fluid">
    <div class="navbar-top-content">
      <div class="status-info">
        <span class="status-item"> <strong>Status:</strong> Active </span>
        <span class="status-divider">|</span>
        <span class="status-item">
          <strong>Last Update:</strong> Just now
        </span>
        <span class="status-divider">|</span>
        <span class="status-item">
          <strong>Pipeline Value:</strong> $500,000
        </span>
      </div>

      <div class="navbar-top-actions">
        <a href="#" class="icon-link" title="Integrations">
          <i class="fas fa-link"></i>
        </a>
        <a href="#" class="icon-notification">
          <i class="fas fa-bell"></i>
          <span class="notification-badge">3</span>
        </a>
        <a href="#" class="icon-notification">
          <i class="fas fa-envelope"></i>
          <span class="notification-badge">2</span>
        </a>
        <a href="#" class="icon-link" title="Settings">
          <i class="fas fa-globe"></i>
        </a>

        <div class="user-menu dropdown">
          <button
            class="user-button dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
          >
            Welcome, {{ currentUser.firstName }} {{ currentUser.lastName }} ({{
              currentUser.role | titlecase
            }})
            <img
              [src]="
                'https://ui-avatars.com/api/?name=' +
                currentUser.firstName +
                '+' +
                currentUser.lastName +
                '&background=random'
              "
              alt="Avatar"
              class="user-avatar"
            />
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" routerLink="/profile">My Profile</a></li>
            <li><a class="dropdown-item" routerLink="/settings">Settings</a></li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button
                class="dropdown-item"
                type="button"
                (click)="logout(); $event.preventDefault()"
              >
                Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Main Navigation -->
<nav class="navbar navbar-expand-lg navbar-main">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="isLoggedIn ? ['/dashboard'] : null" [style.cursor]="isLoggedIn ? 'pointer' : 'default'">
      <i class="fas fa-chart-line"></i> CRM System
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto" *ngIf="isLoggedIn">
        <!-- MENU ITEMS WITH ROLE-BASED VISIBILITY -->
        <li class="nav-item" *ngFor="let item of menuItems" [hidden]="!shouldShowMenu(item)">
          <a
            class="nav-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i [class]="'fas ' + item.icon"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>

        <!-- LOGOUT BUTTON -->
        <!-- <li class="nav-item">
          <a class="nav-link" href="#" (click)="logout(); $event.preventDefault()">
            <i class="fas fa-sign-out-alt"></i>
            <span class="nav-label">Logout</span>
          </a>
        </li> -->
      </ul>
    </div>
  </div>
</nav>
